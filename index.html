<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Snake 🐍</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0a0a12;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            color: #00ff88;
            overflow: hidden;
        }
        h1 {
            text-shadow: 0 0 10px #00ff88, 0 0 20px #00ff88;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        canvas {
            border: 3px solid #00ff88;
            box-shadow: 0 0 20px #00ff88, inset 0 0 20px rgba(0,255,136,0.2);
            background: #111122;
            border-radius: 10px;
        }
        #score {
            font-size: 1.5em;
            margin: 10px 0;
            text-shadow: 0 0 5px #00ff88;
        }
        #instructions {
            margin-top: 10px;
            font-size: 0.9em;
            opacity: 0.8;
        }
        button {
            background: transparent;
            border: 2px solid #00ff88;
            color: #00ff88;
            padding: 10px 20px;
            font-family: inherit;
            font-size: 1em;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 0 10px #00ff88;
            transition: all 0.2s;
        }
        button:hover {
            background: #00ff88;
            color: #0a0a12;
            box-shadow: 0 0 20px #00ff88;
        }
    </style>
</head>
<body>
    <h1>🐍 Neon Snake</h1>
    <div id="score">Score: 0 | High Score: 0</div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div id="instructions">Use Arrow Keys or WASD to move | Space to pause</div>
    <button id="restartBtn">Restart</button>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const restartBtn = document.getElementById('restartBtn');

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [{x: 10, y: 10}];
        let food = {x: 15, y: 15};
        let dx = 0;
        let dy = 0;
        let score = 0;
        let highScore = localStorage.getItem('neonSnakeHigh') || 0;
        let gameRunning = false;
        let gameLoop;
        let particles = [];

        function updateScore() {
            scoreEl.textContent = `Score: ${score} | High Score: ${highScore}`;
        }

        function spawnFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);
            // Make sure food doesn't spawn on snake
            for (let segment of snake) {
                if (segment.x === food.x && segment.y === food.y) {
                    spawnFood();
                    return;
                }
            }
        }

        function createParticles(x, y, color) {
            for (let i = 0; i < 8; i++) {
                particles.push({
                    x: x * gridSize + gridSize/2,
                    y: y * gridSize + gridSize/2,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    life: 20,
                    color: color
                });
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function drawParticles() {
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life / 20;
                ctx.fillRect(p.x, p.y, 3, 3);
                ctx.globalAlpha = 1;
            });
        }

        function draw() {
            // Clear canvas with slight trail effect
            ctx.fillStyle = 'rgba(17, 17, 34, 0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw food with glow
            ctx.shadowColor = '#ff3366';
            ctx.shadowBlur = 15;
            ctx.fillStyle = '#ff3366';
            ctx.beginPath();
            ctx.arc(food.x * gridSize + gridSize/2, food.y * gridSize + gridSize/2, gridSize/2 - 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Draw snake with neon glow
            snake.forEach((segment, index) => {
                const alpha = 1 - (index / snake.length) * 0.5;
                ctx.shadowColor = '#00ff88';
                ctx.shadowBlur = 10;
                ctx.fillStyle = `rgba(0, 255, 136, ${alpha})`;
                ctx.fillRect(segment.x * gridSize + 1, segment.y * gridSize + 1, gridSize - 2, gridSize - 2);
                ctx.shadowBlur = 0;
            });

            drawParticles();
            updateParticles();
        }

        function move() {
            if (!gameRunning) return;

            const head = {x: snake[0].x + dx, y: snake[0].y + dy};

            // Wall collision
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                gameOver();
                return;
            }

            // Self collision
            for (let segment of snake) {
                if (head.x === segment.x && head.y === segment.y) {
                    gameOver();
                    return;
                }
            }

            snake.unshift(head);

            // Eat food
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('neonSnakeHigh', highScore);
                }
                updateScore();
                createParticles(food.x, food.y, '#ff3366');
                spawnFood();
            } else {
                snake.pop();
            }

            draw();
        }

        function gameOver() {
            gameRunning = false;
            clearInterval(gameLoop);
            createParticles(snake[0].x, snake[0].y, '#ff3366');
            setTimeout(() => {
                alert(`Game Over! Score: ${score}`);
            }, 100);
        }

        function startGame() {
            snake = [{x: 10, y: 10}];
            dx = 1;
            dy = 0;
            score = 0;
            updateScore();
            spawnFood();
            gameRunning = true;
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(move, 100);
            draw();
        }

        document.addEventListener('keydown', (e) => {
            if (!gameRunning && e.key !== ' ') return;
            switch(e.key) {
                case 'ArrowUp': case 'w': case 'W':
                    if (dy !== 1) { dx = 0; dy = -1; }
                    break;
                case 'ArrowDown': case 's': case 'S':
                    if (dy !== -1) { dx = 0; dy = 1; }
                    break;
                case 'ArrowLeft': case 'a': case 'A':
                    if (dx !== 1) { dx = -1; dy = 0; }
                    break;
                case 'ArrowRight': case 'd': case 'D':
                    if (dx !== -1) { dx = 1; dy = 0; }
                    break;
                case ' ':
                    gameRunning = !gameRunning;
                    if (gameRunning) gameLoop = setInterval(move, 100);
                    else clearInterval(gameLoop);
                    break;
            }
            e.preventDefault();
        });

        restartBtn.addEventListener('click', startGame);

        // Initial draw
        updateScore();
        draw();
        spawnFood();
    </script>
</body>
</html>
